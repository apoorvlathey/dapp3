<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>local-eth-limo settings</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <main>
      <h1>local-eth-limo</h1>
      <p class="sub">Local-first ENS gateway.</p>

      <section>
        <h2>Ethereum RPC endpoints</h2>
        <p class="hint">
          The <em>first</em> RPC is what Helios uses to fetch execution-layer
          state (verified against the consensus-committed state root). Helios
          reboots if you change which one is first.
        </p>
        <div id="rpc-list" class="rpc-list"></div>
        <form id="rpc-add">
          <input
            type="url"
            name="url"
            placeholder="https://your-rpc.example/…"
            required
          />
          <button type="submit">Add</button>
        </form>
      </section>

      <section>
        <h2>Helios</h2>
        <ul>
          <li>Consensus RPC: <code id="consensus-rpc">(default)</code></li>
          <li>Status: <code id="helios-live">loading…</code></li>
        </ul>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
