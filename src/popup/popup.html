<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dapp3</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 4 L8 17 L16 13 L24 17 Z" fill="#10b981"/>
            <path d="M16 28 L8 19 L16 15 L24 19 Z" fill="#059669"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-title">dapp3</span>
          <span class="brand-subtitle">Local ENS gateway</span>
        </span>
      </div>

      <section class="card">
        <div class="row">
          <span class="label">IPFS node</span>
          <span class="status">
            <span class="dot" id="ipfs-dot"></span>
            <span id="ipfs-status">checking…</span>
          </span>
        </div>
        <div class="row">
          <span class="label">Helios</span>
          <span class="status">
            <span class="dot" id="helios-dot"></span>
            <span id="helios-status">unknown</span>
          </span>
        </div>
      </section>

      <div class="error-card" id="helios-error-card" hidden>
        <div class="error-card-label">Helios error</div>
        <pre id="helios-error-detail"></pre>
      </div>

      <div class="actions">
        <button id="open-options" class="primary">Open settings</button>
      </div>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
