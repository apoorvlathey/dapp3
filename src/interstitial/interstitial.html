<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>dapp3 · resolving</title>
    <link rel="stylesheet" href="./interstitial.css" />
  </head>
  <body>
    <div id="bar" class="bar"></div>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 4 L8 17 L16 13 L24 17 Z" fill="#10b981"/>
            <path d="M16 28 L8 19 L16 15 L24 19 Z" fill="#059669"/>
          </svg>
        </span>
        <span class="status" id="statusBadge">
          <span class="dot" id="statusDot"></span>
          <span class="statelabel" id="statusLabel">Helios offline</span>
        </span>
      </div>
      <div class="info">
        <div class="addrpill" role="group" aria-label="Resolving address">
          <svg class="magnifier" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="7" cy="7" r="4.5"/>
            <path d="M10.5 10.5 L14 14"/>
          </svg>
          <span class="name" id="name">—</span>
          <button id="star" type="button" class="star-btn" aria-label="favorite" aria-pressed="false" title="Favorite this site">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="actions">
        <button id="bypass" type="button" class="ghost">
          Skip Helios this time
        </button>
      </div>
    </header>
    <main class="stage">
      <div id="loader" class="sonar" aria-hidden="true">
        <span class="ping"></span>
        <span class="ping"></span>
        <span class="ping"></span>
        <span class="core"></span>
      </div>
      <p class="stage-status" id="status">Starting Helios…</p>
      <p class="stage-sub" id="stageSub">
        Verifying ENS state against Ethereum consensus, then fetching from your
        local IPFS node.
      </p>
      <div class="stage-error" id="errorCard" hidden>
        <div class="stage-error-label">Reason</div>
        <pre id="errorDetail"></pre>
        <a id="ethlimoFallback" class="stage-fallback" rel="noopener noreferrer" hidden>
          Open on eth.limo gateway →
        </a>
      </div>
    </main>
    <script type="module" src="./interstitial.ts"></script>
  </body>
</html>
