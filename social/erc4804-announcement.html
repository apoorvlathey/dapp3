<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>dapp3 — ERC-4804</title>
<style>
  :root {
    --bg-app: #09090b;
    --bg-card: #131518;
    --border: rgba(255, 255, 255, 0.08);
    --text-primary: #f5f7fb;
    --text-muted: #a0a8b3;
    --text-subtle: #707985;
    --brand-500: #10b981;
    --brand-400: #34d399;
    --brand-300: #6ee7b7;
    --brand-tint-bg: rgba(3, 48, 37, 0.72);
    --brand-tint-border: rgba(52, 211, 153, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg-app);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body {
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .card {
    width: 1600px;
    height: 900px;
    position: relative;
    overflow: hidden;
    padding: 88px 104px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      radial-gradient(ellipse 55% 50% at 88% 8%, rgba(16, 185, 129, 0.22), transparent 60%),
      radial-gradient(ellipse 50% 45% at 6% 96%, rgba(56, 189, 248, 0.14), transparent 65%),
      linear-gradient(180deg, #0a0b0d 0%, #08090b 100%);
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 80%);
    opacity: 0.45;
    pointer-events: none;
  }

  /* ---------- Top: brand only ---------- */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    font-family: "SF Mono", Menlo, Monaco, ui-monospace, monospace;
    font-weight: 700;
    font-size: 30px;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: block;
    box-shadow:
      0 0 0 1px var(--border),
      0 10px 28px -14px rgba(16, 185, 129, 0.4);
  }

  .version-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(20, 23, 28, 0.78);
    color: var(--text-muted);
    font-family: "SF Mono", Menlo, Monaco, ui-monospace, monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    z-index: 1;
    margin-top: -10px;
  }
  .announce {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid var(--brand-tint-border);
    background: linear-gradient(180deg, rgba(6, 95, 70, 0.55), rgba(3, 48, 37, 0.82));
    color: var(--brand-300);
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    box-shadow: 0 14px 32px -22px rgba(16, 185, 129, 0.6);
    margin-bottom: 38px;
  }
  .announce .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--brand-500);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.22);
  }
  h1 {
    font-size: 132px;
    line-height: 0.95;
    letter-spacing: -0.05em;
    font-weight: 700;
    color: var(--text-primary);
    max-width: 1320px;
  }
  h1 .accent {
    color: var(--brand-400);
    text-shadow: 0 0 48px rgba(52, 211, 153, 0.32);
  }
  .sub {
    margin-top: 30px;
    color: var(--text-muted);
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.005em;
    max-width: 1100px;
  }
  .sub b {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* ---------- Bottom: example URL ---------- */
  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
    gap: 32px;
  }
  .example-label {
    color: var(--text-subtle);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .url-tag {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 22px 34px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(20, 23, 28, 0.94), rgba(16, 18, 22, 0.92));
    border: 1px solid var(--border);
    box-shadow:
      0 0 0 1px rgba(16, 185, 129, 0.08),
      0 32px 80px -36px rgba(16, 185, 129, 0.55);
    font-family: "SF Mono", Menlo, Monaco, ui-monospace, monospace;
    font-size: 38px;
  }
  .url-tag .scheme { color: var(--text-subtle); }
  .url-tag .name { color: var(--text-primary); font-weight: 600; }
  .url-tag .tld { color: var(--brand-400); }
  .url-tag .caret {
    color: var(--text-subtle);
    font-size: 24px;
    margin-left: 4px;
  }
</style>
</head>
<body>
<div class="card">

  <div class="top">
    <div class="brand">
      <img class="brand-mark" src="./logo.svg" alt="dapp3 logo" />
      dapp3
    </div>
    <div class="version-pill">v1.1.1</div>
  </div>

  <div class="hero">
    <div class="announce">
      <span class="dot"></span>
      New in dapp3 · ERC-4804
    </div>
    <h1>Now serving fully <span class="accent">onchain</span> dapps.</h1>
    <p class="sub">HTML lives on Ethereum. dapp3 fetches it, verifies it, and renders it. No public gateway in the path.</p>
  </div>

  <div class="bottom">
    <span class="example-label">Try it</span>
    <div class="url-tag">
      <span class="scheme">https://</span><span class="name">zrouter</span><span class="tld">.eth</span>
      <span class="caret">|</span>
    </div>
  </div>

</div>
</body>
</html>
