<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Canvas: zinc-950 rounded square with zinc-800 border -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="#09090b"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="25.5" fill="none" stroke="#27272a" stroke-width="1"/>

  <!-- Emerald left-stripe: signature priority-border pattern from the design system -->
  <rect x="2" y="22" width="5" height="84" rx="2.5" fill="#059669"/>

  <!-- Ethereum diamond mark, emerald palette -->
  <!-- Upper half: two triangles meeting at a horizontal band -->
  <g transform="translate(64, 36)">
    <!-- upper-left face: brighter -->
    <path d="M 0 0 L -22 32 L 0 20 Z" fill="#10b981"/>
    <!-- upper-right face: darker to give depth -->
    <path d="M 0 0 L 22 32 L 0 20 Z" fill="#059669"/>
    <!-- lower diamond -->
    <path d="M 0 56 L -22 24 L 0 36 Z" fill="#059669"/>
    <path d="M 0 56 L 22 24 L 0 36 Z" fill="#047857"/>
  </g>

  <!-- "Local" live indicator: emerald-300 dot, bottom-right -->
  <circle cx="100" cy="100" r="6" fill="#6ee7b7"/>
  <circle cx="100" cy="100" r="10" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5"/>
</svg>
